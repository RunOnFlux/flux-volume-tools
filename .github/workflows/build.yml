name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Alpine patch releases reach the image through this, since the Dockerfile pins
  # a minor tag rather than a patch.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/runonflux/flux-volume-tools

jobs:
  # Asserts each binary is the implementation the executor relies on. A change in
  # Alpine's packaging fails the build here rather than shipping a busybox applet.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: flux-volume-tools:test

      - name: Assert the toolchain
        run: |
          set -euo pipefail

          # Output is captured before matching rather than piped into grep: `grep -q`
          # exits on its first match and closes the pipe, and the SIGPIPE that sends
          # upstream trips `pipefail` non-deterministically.
          assert() {
            local label="$1" pattern="$2"; shift 2
            local out
            out="$(docker run --rm flux-volume-tools:test "$@" 2>&1 || true)"
            if grep -q -- "$pattern" <<<"$out"; then
              echo "ok - $label"
            else
              echo "FAIL - $label (no match for '$pattern')"
              echo "$out" | head -5
              exit 1
            fi
          }

          assert "unzip is Info-ZIP, not the busybox applet (zip64)" 'Info-ZIP' unzip -v
          assert "tar supports --no-same-owner"                     'no-same-owner' tar --help
          assert "cp supports -T"                                   '-T' cp --help
          assert "mv supports -T"                                   '-T' mv --help
          assert "zip is present and can create an archive"          'zip' sh -c 'command -v zip'
          assert "gzip is present"                                  'gzip' sh -c 'command -v gzip'

          echo "-T must actually refuse to recurse into an existing destination"
          docker run --rm flux-volume-tools:test sh -c '
            mkdir -p /tmp/src /tmp/dst && echo hi > /tmp/src/f
            cp -a -T /tmp/src /tmp/dst
            test -f /tmp/dst/f && ! test -e /tmp/dst/src
          '
          echo "ok - cp -a -T does not nest"

          # flux-op's contract: the destination changes only on success, and it
          # changes atomically whatever the two entry types are. rename(2) cannot
          # replace a file with a directory (or the reverse) at all, and refuses
          # a non-empty directory target - which is why publishing goes through a
          # swap rather than a delete-then-rename, and why every combination is
          # covered here rather than just the common one.
          op() {
            local label="$1" script="$2"
            if docker run --rm flux-volume-tools:test sh -c "$script" >/dev/null 2>&1; then
              echo "ok - $label"
            else
              echo "FAIL - $label"
              exit 1
            fi
          }

          # The identifier FluxOS passes. Its exact shape is what lets the boot
          # sweep tell this script's artefacts from a folder a user named.
          ID=3f2504e0-4f89-41d3-9a0c-0305e82c3301
          FO="flux-op --id $ID --root /w"

          op "a failed command leaves the destination untouched" '
            mkdir -p /w && echo original > /w/dest
            '"$FO"' --discard-staging /w/.flux-op-1 /w/dest -- false 2>/dev/null && exit 1
            grep -qx original /w/dest'

          op "a directory replaces an existing file" '
            mkdir -p /w/src && echo new > /w/src/f && echo original > /w/dest
            '"$FO"' --discard-staging /w/.flux-op-2 /w/dest -- cp -a -T /w/src /w/.flux-op-2
            grep -qx new /w/dest/f'

          op "a directory replaces an existing directory, and does not merge into it" '
            mkdir -p /w/src /w/dest && echo new > /w/src/f && echo old > /w/dest/keep
            '"$FO"' --discard-staging /w/.flux-op-3 /w/dest -- cp -a -T /w/src /w/.flux-op-3
            grep -qx new /w/dest/f
            test ! -e /w/dest/keep'

          op "a file replaces an existing directory" '
            mkdir -p /w && echo new > /w/src && mkdir -p /w/dest && echo old > /w/dest/keep
            '"$FO"' --discard-staging /w/.flux-op-4 /w/dest -- cp -a -T /w/src /w/.flux-op-4
            grep -qx new /w/dest'

          op "a new destination leaves no staging or swap directory behind" '
            mkdir -p /w/src && echo new > /w/src/f
            '"$FO"' --discard-staging /w/.flux-op-5 /w/dest -- cp -a -T /w/src /w/.flux-op-5
            grep -qx new /w/dest/f
            test -z "$(ls -A /w | grep flux- || true)"'

          op "--mkdir creates the staging directory for commands that need one" '
            mkdir -p /w/src && echo x > /w/src/f && tar -cf /w/a.tar -C /w src
            '"$FO"' --discard-staging --mkdir /w/.flux-op-6 /w/out -- tar -xf /w/a.tar -C /w/.flux-op-6
            grep -qx x /w/out/src/f'

          op "a result over the byte ceiling is refused and its staging removed" '
            # Checked after the command rather than from what an archive claims
            # about itself - those numbers are attacker-written, so a bomb lies.
            mkdir -p /w/src && head -c 2000 /dev/zero > /w/src/big
            '"$FO"' --discard-staging --max-bytes 1000 /w/.flux-op-8 /w/dest -- cp -a -T /w/src /w/.flux-op-8 2>/dev/null && exit 1
            test ! -e /w/dest
            test ! -e /w/.flux-op-8'

          op "a result containing a link is refused" '
            mkdir -p /w/src && ln -s /etc/shadow /w/src/link
            '"$FO"' --discard-staging --no-links /w/.flux-op-9 /w/dest -- cp -a -T /w/src /w/.flux-op-9 2>/dev/null && exit 1
            test ! -e /w/dest'

          op "a failed command leaves no staging behind" '
            mkdir -p /w/src && echo x > /w/src/f
            '"$FO"' --discard-staging /w/.flux-op-10 /w/dest -- false 2>/dev/null && exit 1
            test ! -e /w/.flux-op-10'

          # A move and a rename have NO command: the caller's source already IS
          # the result, so publishing it is the whole operation. Every case
          # above supplies one, which is how a usage check that demanded four
          # positional arguments rejected every move without anything noticing.
          op "a move publishes with no command at all" '
            mkdir -p /w/photos && echo hi > /w/photos/f
            '"$FO"' /w/photos /w/out --
            test -f /w/out/f
            test ! -e /w/photos'

          op "a move over an existing destination swaps it aside and cleans up" '
            mkdir -p /w/photos && echo new > /w/photos/f && echo old > /w/out
            '"$FO"' /w/photos /w/out --
            grep -qx new /w/out/f
            test -z "$(ls -A /w | grep flux- || true)"'

          # Staging is only ever discarded when the caller says it owns it. A
          # move'"'"'s operand is the user'"'"'s own data, and discarding it on a
          # failure would destroy the only copy.
          op "a failure never discards an operand the caller still owns" '
            mkdir -p /w/photos && echo precious > /w/photos/f
            '"$FO"' --max-bytes 1 /w/photos /w/dest -- true 2>/dev/null && exit 1
            grep -qx precious /w/photos/f'

          # SIGTERM must reach the command and the staging directory must go
          # with it. An untrapped TERM kills the shell outright and the EXIT
          # trap never runs, leaving the space spent on the caller'"'"'s volume
          # until the next boot sweep.
          op "a cancelled operation stops its command and reclaims its staging" '
            mkdir -p /w && echo original > /w/dest
            '"$FO"' --discard-staging --mkdir /w/.flux-op-11 /w/dest -- sleep 30 &
            pid=$!
            sleep 1
            kill -TERM $pid
            wait $pid 2>/dev/null
            sleep 1
            test ! -e /w/.flux-op-11
            grep -qx original /w/dest
            test -z "$(pgrep -x sleep || true)"'

          # The crash BETWEEN the two renames of a publish - the state the
          # marker exists for. Reproduced with a stub mv that fails on its
          # second call, rather than by hand: a fixture built by hand asserts
          # itself, and would pass even if flux-op wrote no marker at all.
          op "an interrupted publish leaves a relative marker at the volume root" '
            mkdir -p /stub
            real=$(command -v mv)
            printf "%s\n" "#!/bin/sh" "if [ -e /tmp/mv1 ]; then exit 1; fi" "touch /tmp/mv1" "exec $real \"\$@\"" > /stub/mv
            chmod +x /stub/mv
            mkdir -p /w/a/b/photos /w/x/y && echo new > /w/a/b/photos/f && echo precious > /w/x/y/out
            PATH=/stub:$PATH '"$FO"' /w/a/b/photos /w/x/y/out -- 2>/dev/null && exit 1
            # relative to the volume root, so nothing that reads it can be sent
            # off the volume by following an absolute path
            grep -qx x/y/out /w/.flux-old-'"$ID"'.dest
            # at the root, which is the one directory the sweep reads - not
            # beside the source, wherever the caller happened to keep it
            test ! -e /w/a/b/.flux-old-'"$ID"'
            grep -qx precious /w/.flux-old-'"$ID"'
            # and the caller still has their source
            grep -qx new /w/a/b/photos/f'

          op "the identifier and the volume root are required" '
            mkdir -p /w
            flux-op /w/.flux-op-12 /w/dest -- true 2>/dev/null && exit 1
            test $? -ne 0'

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # This digest is the value FluxOS pins. It is the manifest LIST digest, so it
      # resolves to the right architecture on both x86 and arm nodes.
      - name: Publish digest to run summary
        run: |
          {
            echo '## Published'
            echo
            echo 'Pin this in FluxOS:'
            echo
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
